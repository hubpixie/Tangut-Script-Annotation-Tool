<body>
    <div class="container">
        <div class="language-selector">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ru">Русский</option>
            </select>
        </div>

        <h1 data-i18n="title">西夏文<br>自动标注工具 α</h1>

        <div class="input-section has-clear">
            <label for="output" data-i18n="input-label">输入字符：</label>
            <textarea id="output" placeholder="𘉰𘟀𘅇𘉪" rows="3" style="font-size: 24px; line-height: 1.4;"></textarea>
            <input type="hidden" id="outputHisState">
            <div class="button-group">
                <button onclick="handleGenerate()" data-i18n="generate">生成</button>
                <button class="btn-undo" onclick="undoStrokeOutput()" data-i18n="undo">撤销</button>
            </div>
        </div>

        <div class="explanation" id="rollover-info">
            <!-- 通过JavaScript动态填充搜索结果 -->
        </div>

        <div id="search-results">
            <div class="results-viewport">
                <ul id="result-list" class="results-wrapper">
                    <!-- 通过JavaScript动态填充搜索结果 -->
                </ul>
            </div>
        </div>

        <!-- tab menus（4 items） START-->
        <div class="tab-nav">
            <button class="tab-btn active" data-i18n="stroke-tab-title" data-target="stroke-tab">笔画</button>
            <button class="tab-btn" data-i18n="lfw-tab-title"  data-target="lfw-tab">LFW序号</button>
            <button class="tab-btn" data-i18n="fourcode-tab-title"  data-target="fourcode-tab">四角号码</button>
            <button class="tab-btn" data-i18n="unicode-tab-title"  data-target="unicode-tab">Unicode编码</button>
        </div> <!-- tab menus END-->

        <!-- tab contents area START -->
        <!-- contents of the Strokes Tab  -->
        <div class="tab-content-container">
            <div class="tab-pane active" id="stroke-tab">
                <div class="code-entry-container has-clear" style="margin-bottom: 15px;">
                    <div class="checkbox-wrapper" title="starts with">
                        <label onclick="toggleCheckbox('stroke-begins-with')">^</label>
                        <input type="checkbox" id="stroke-begins-with" />
                    </div>
                    <input type="text" class="code-entry-field" id="stroke-entry-field" data-i18n="stroke-entry-placeholder"
                        inputmode="latin" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Stoke Entry" />
                    <div class="checkbox-wrapper" title="ends with">
                        <input type="checkbox" id="stroke-ends-with" />
                        <label onclick="toggleCheckbox('stroke-ends-with')">$</label>
                    </div>

                </div>

                <div id="stroke-buttons">
                    <!-- 使用 JavaScript 动态生成笔画按钮 -->
                </div>

            </div>

            <!-- contents of the LFW Code Tab  -->
            <div id="lfw-tab" class="tab-pane">
                <div class="code-entry-container has-clear">
                    <input type="text" class="code-entry-field" id="lfw-entry-field" inputmode="numeric" pattern="[0-9]*" data-i18n="lfw-entry-placeholder"
                        placeholder="LFW(0001~9999)" style="margin-left:40px; margin-right: 40px;"/>
                </div>
            </div>

            <!-- contents of the Four-Corder Code Tab  -->
            <div id="fourcode-tab" class="tab-pane">
                <div class="code-entry-container has-clear">
                    <input type="text" class="code-entry-field" id="fourcode-entry-field" inputmode="latin" autocapitalize="none" autocomplete="off" spellcheck="false"data-i18n="fourcode-entry-placeholder"
                        placeholder="Four Corner" style="margin-left:40px; margin-right: 40px;"/>
                </div>
            </div>

            <!-- contents of the Unicode Tab  -->
            <div id="unicode-tab" class="tab-pane">
                <div class="code-entry-container has-clear">
                    <input type="text" class="code-entry-field" id="unicode-entry-field" inputmode="latin"autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n="unicode-entry-placeholder"
                        placeholder="Unicode(0-9,A-F)" style="margin-left:40px; margin-right: 40px;"/>
                </div>
            </div>
        </div> <!-- tab contents area END -->
    </div>

    <div class="controls">
        <div class="radio-group">
            <label data-i18n="language-choice">语言选择：</label>
            <label>
                <input type="radio" name="lang" value="CN" id="lang-cn" checked>
                <span data-i18n="chinese">中文</span>
            </label>
            <label>
                <input type="radio" name="lang" value="EN" id="lang-en">
                <span data-i18n="english">English</span>
            </label>
        </div>

        <div class="radio-group">
            <label data-i18n="reading-system">读音系统：</label>
            <label>
                <input type="radio" name="reading" value="GX" id="reading-gx" checked>
                <span data-i18n="gongxun">龚勋</span>
            </label>
            <label>
                <input type="radio" name="reading" value="GHC" id="reading-ghc">
                <span data-i18n="gonghuangcheng">龚煌城</span>
            </label>
        </div>

        <div class="radio-group">
            <label data-i18n="output-format">输出格式：</label>
            <label>
                <input type="radio" name="format" value="typst" id="format-typst" checked>
                Typst
            </label>
            <label>
                <input type="radio" name="format" value="obsidian" id="format-obsidian">
                Obsidian
            </label>
            <label>
                <input type="radio" name="format" value="plaintext" id="format-plaintext">
                <span data-i18n="plain-text">纯文本</span>
            </label>
        </div>

        <div class="radio-group">
            <label data-i18n="show-lfw">显示编号：</label>
            <label>
                <input type="checkbox" name="showLFW" id="show-lfw">
                <span data-i18n="lfw-label">LFW</span>
            </label>
            <label>
                <input type="checkbox" name="showLFW" id="show-fourcorner">
                <span data-i18n="fourcorner-label">LFW</span>
            </label>
        </div>
    </div>

    <div class="output-section has-clear">
        <label for="output-text" data-i18n="format-output">格式输出：</label>
        <textarea id="output-text"
            style="font-family: Fira Sans, 'Tangut N4694', 'Noto Serif Tangut', 'Noto Serif SC', sans-serif; transform: translateY(8%); margin-bottom:30px;"></textarea>
        <button onclick="copyOutput()" id="copy-btn" data-i18n="copy-clipboard">复制到剪贴板</button>
    </div>
    <div class="footer" style="text-align: center; margin: 20px auto;">
        <a href="https://github.com/tinbreaker/Tangut-Script-Annotation-Tool">© 𗼇𘝞𗫸𗯿𘍞</a>
